name: Build Test

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - public_stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v2
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Build MUSIC
        run: |
          mkdir build
          cd build
          cmake ..
          make -j2
          make install
      - name: Gubser Flow Test Ideal + shear
        run: |
          pip3 install numpy
          $GITHUB_WORKSPACE/tests/Gubser_flow/RunAutoTest.sh
      - name: Cartesian Test energy-momentum tensor
        run: |
          $GITHUB_WORKSPACE/tests/test_1+1DRiemannTest_Cartesian/RunAutoTest.sh
      - name: Cartesian Test net baryon current
        run: |
          $GITHUB_WORKSPACE/tests/test_1+1DDiffusionTest_Cartesian/RunAutoTest.sh
      - name: IPGlasma 2D Test shear + bulk
        run: |
          $GITHUB_WORKSPACE/tests/testIPGlasma2D/RunAutoTest.sh
      - name: net baryon diffusion 1D Test
        run: |
          $GITHUB_WORKSPACE/tests/test_1+1D_with_Akihiko/RunAutoTest.sh

  # ── Kokkos single-source cross-backend consistency gate (PlanKokkosPort.md D9) ─
  # Builds the CPU reference and two Kokkos host backends (Serial + OpenMP) from
  # the ONE kernel source, and checks each vs CPU and the Kokkos backends vs each
  # other (tests/kokkos_consistency.sh).  Uses EOS 0 (ideal gas, analytic — no
  # table download needed in CI).  The Cuda backend needs a GPU runner, so it is
  # exercised on hardware (it is auto-skipped here); Serial == OpenMP is the
  # exec-space-independence proof that catches single-source drift on every push.
  kokkos-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Fetch Kokkos (pinned 5.1.1)
        run: bash get_kokkos.sh
      - name: Build CPU reference
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Build Kokkos Serial backend
        run: |
          cmake -S . -B build_kokkos_serial -DUSE_KOKKOS=ON \
                -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=OFF \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build_kokkos_serial -j2
      - name: Build Kokkos OpenMP backend
        run: |
          cmake -S . -B build_kokkos -DUSE_KOKKOS=ON \
                -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=ON \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build_kokkos -j2
      - name: D9 consistency gate (Serial == OpenMP, both vs CPU)
        run: EOS_ID=0 bash tests/kokkos_consistency.sh
